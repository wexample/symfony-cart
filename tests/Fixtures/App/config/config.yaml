services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: true

  Wexample\SymfonyRemotePayment\Class\FakePaymentProvider:
    arguments:
      $name: fake
      $methods: [card]

  Wexample\SymfonyCart\Tests\Fixtures\Handler\RecordingPaidHandler: ~
  Wexample\SymfonyCart\Tests\Fixtures\Handler\MemberPriceResolver: ~

  Wexample\SymfonyCart\Tests\Fixtures\Handler\CartEventRecorder:
    tags:
      - { name: kernel.event_listener, event: Wexample\SymfonyCart\Event\CartPaidEvent, method: record }
      - { name: kernel.event_listener, event: Wexample\SymfonyCart\Event\CartExpiredEvent, method: record }
